const T={th:{title:'แบบประเมินความพร้อมสำหรับการเดินทางและวีซ่าไนจีเรีย',intro:'กรุณาตอบตามความเป็นจริง แบบประเมินนี้ใช้คัดกรองความพร้อมเบื้องต้นสำหรับผู้ถือสัญชาติไทยที่ต้องการเดินทางไปไนจีเรีย',identity:'ข้อมูลผู้สมัคร',name:'ชื่อและนามสกุล',contact:'เบอร์โทรศัพท์หรือช่องทางติดต่อ',notice:'ผลนี้เป็นการประเมินเบื้องต้นเท่านั้น ไม่ใช่การรับประกันการออกหนังสือเดินทาง การอนุญาตให้ออกจากประเทศไทย หรือการอนุมัติวีซ่าไนจีเรีย',submit:'ส่งคำตอบและผลการประเมิน',progress:n=>`ตอบแล้ว ${n} จาก 36 ข้อ`,sections:{legal:'1. สถานะทางกฎหมายและคดีความ',civil:'2. สัญชาติและทะเบียนราษฎรไทย',criminal:'3. ประวัติทางกฎหมาย',finance:'4. การเงินและการทำงาน',travel:'5. ประวัติการเดินทาง',nigeria:'6. ความพร้อมสำหรับวีซ่าไนจีเรีย',extra:'7. ข้อมูลเพิ่มเติม'},missing:'กรุณาตอบทุกคำถามก่อนส่งแบบประเมิน',good:'ผู้สมัครมีความพร้อมเบื้องต้นดี',review:'ควรตรวจสอบเพิ่มเติมก่อนยื่นคำขอ',risk:'พบประเด็นสำคัญที่ต้องตรวจสอบ',goodText:'คำตอบโดยรวมแสดงถึงความพร้อมด้านเอกสารและการเดินทางที่ดี แต่การอนุมัติวีซ่าขึ้นอยู่กับหน่วยงานตรวจคนเข้าเมืองไนจีเรีย',reviewText:'มีเอกสารหรือประเด็นบางอย่างที่ควรแก้ไขหรือตรวจสอบก่อนยื่นคำขอวีซ่า',riskText:'พบข้อมูลด้านกฎหมาย หนังสือเดินทาง หรือประวัติการเข้าเมืองที่ควรได้รับการตรวจสอบก่อนดำเนินการต่อ'},en:{title:'Nigeria Travel and Visa Readiness Screening',intro:'Please answer accurately. This screening reviews preliminary readiness for a Thai national who wants to travel to Nigeria.',identity:'Applicant details',name:'Full name',contact:'Telephone or contact number',notice:'This result is a preliminary readiness assessment. It does not guarantee a Thai passport, permission to leave Thailand, a Nigerian visa, or entry into Nigeria.',submit:'Submit answers and assessment',progress:n=>`${n} of 36 answered`,sections:{legal:'1. Legal and court status',civil:'2. Thai citizenship and civil registration',criminal:'3. Legal history',finance:'4. Financial and employment position',travel:'5. Travel and immigration history',nigeria:'6. Nigerian visa readiness',extra:'7. Additional information'},missing:'Please answer every question before submitting.',good:'Strong preliminary candidate',review:'Further review recommended before applying',risk:'Significant issue identified for review',goodText:'The answers indicate good preliminary documentary and travel readiness. Final visa approval rests with Nigerian immigration authorities.',reviewText:'Some documents or circumstances need attention before a Nigerian visa application is submitted.',riskText:'A legal, passport, or immigration issue has been identified and should be reviewed before proceeding.'}};

function render(){const t=T[lang];document.documentElement.lang=lang;title.textContent=t.title;intro.textContent=t.intro;identityTitle.textContent=t.identity;nameLabel.textContent=t.name;contactLabel.textContent=t.contact;notice.textContent=t.notice;submitBtn.textContent=t.submit;langField.value=lang==='th'?'Thai':'English';thBtn.classList.toggle('active',lang==='th');enBtn.classList.toggle('active',lang==='en');qs.innerHTML='';let n=0;Q.forEach(sec=>{const s=document.createElement('section');s.className='card';const h=document.createElement('h2');h.textContent=t.sections[sec[0]];s.appendChild(h);sec.slice(1).forEach(q=>{n++;const d=document.createElement('div');d.className='q';d.dataset.q=q[0];const p=document.createElement('div');p.className='qt';p.textContent=n+'. '+q[lang==='th'?1:2];d.appendChild(p);const o=document.createElement('div');o.className='opts';q[3].forEach(x=>{const [th,en]=x.split('|');const l=document.createElement('label');l.className='opt';const i=document.createElement('input');i.type='radio';i.name=q[0];i.value=en;i.required=true;i.addEventListener('change',update);const sp=document.createElement('span');sp.textContent=lang==='th'?th:en;l.append(i,sp);o.appendChild(l)});d.appendChild(o);s.appendChild(d)});qs.appendChild(s)});update()}
function val(n){return form.querySelector(`input[name=q${n}]:checked`)?.value||''}function update(){let c=0;for(let i=1;i<=36;i++)if(val(i))c++;bar.style.width=(c/36*100)+'%';progressText.textContent=T[lang].progress(c)}
function assess(){let blockers=0,concerns=0,missing=0;const reasons=[];if(val(6)!=='Yes'){blockers++;reasons.push('Thai citizenship not confirmed')}if(['Yes','Not sure'].includes(val(1))){blockers++;reasons.push('Active warrant status requires review')}if(['Yes','Not sure'].includes(val(4))){blockers++;reasons.push('Possible restriction on leaving Thailand')}if(['No','Expired card','No card'].includes(val(7))){concerns++;reasons.push('Thai ID issue')}if(val(11)!=='Yes'||['No','I do not have a passport yet'].includes(val(12))){missing++;reasons.push('Passport not ready or validity issue')}if(val(18)!=='Yes'){missing++;reasons.push('180 day bank statement not confirmed')}if(val(28)!=='Yes'){missing++;reasons.push('No Nigerian host confirmed')}if(val(30)!=='Yes'){missing++;reasons.push('Invitation or host documentation not confirmed')}if(val(31)!=='Yes'){missing++;reasons.push('Accommodation or host address not confirmed')}if(val(32)!=='Yes'){missing++;reasons.push('Return travel evidence not confirmed')}if(val(33)!=='Yes'){missing++;reasons.push('Sufficient funds evidence not confirmed')}if(['Yes','Not sure'].includes(val(26))){concerns++;reasons.push('Possible immigration blacklist history')}if(val(35)==='Yes, refused'){concerns++;reasons.push('Previous Nigerian visa refusal')}if(['Yes','Not sure'].includes(val(36))){concerns++;reasons.push('Applicant identified another possible legal or immigration issue')}if(val(24)==='Yes'||val(23)==='Yes'){concerns++;reasons.push('Previous removal or refused entry history')}if(blockers>0)return['risk',reasons];if(concerns>=2)return['risk',reasons];if(concerns||missing>=2)return['review',reasons];return['good',reasons.length?reasons:['No major screening concerns identified']]}
form.addEventListener('submit',e=>{error.textContent='';let complete=true;for(let i=1;i<=36;i++)if(!val(i))complete=false;if(!complete){e.preventDefault();error.textContent=T[lang].missing;return}const [grade,reasons]=assess(),t=T[lang];assessmentField.value=grade==='good'?'Strong preliminary candidate':grade==='review'?'Further review recommended before applying':'Significant issue identified for review';reasonsField.value=reasons.join('; ');badge.className='badge '+grade;badge.textContent=t[grade];resultText.textContent=t[grade+'Text'];result.style.display='block'});
thBtn.addEventListener('click',()=>{lang='th';render()});enBtn.addEventListener('click',()=>{lang='en';render()});render();
</script></body></html>
